<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "${HTTPS_CERT_FILE}"
    SSLCertificateKeyFile "${HTTPS_KEY_FILE}"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
